name: Build, Verify & Deploy Numeriq to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_and_verify:
    name: Build, Verify & Package Static Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies cleanly
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Run calculator formula verification tests
        run: npm run test

      - name: Resolve production SITE_URL
        shell: bash
        env:
          VAR_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$VAR_SITE_URL" ]; then
            echo "SITE_URL=$VAR_SITE_URL" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
          fi

      - name: Build production bundle & prerender pages
        run: npm run build:production

      - name: Write custom domain CNAME if configured
        if: env.SITE_URL != ''
        shell: bash
        run: |
          HOST=$(node -e "console.log(new URL(process.env.SITE_URL).hostname)")
          if [[ "$HOST" != *.github.io && ! -f dist/CNAME ]]; then
            echo "$HOST" > dist/CNAME
          fi

      - name: Run SEO & expansion quality audits
        run: |
          npx tsx scripts/verify-seo-infrastructure.ts
          npx tsx scripts/audit-expansion-quality.ts

      - name: Setup GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy_pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build_and_verify
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
