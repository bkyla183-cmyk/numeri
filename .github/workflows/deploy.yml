name: Deploy to GitHub Pages (gh-pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build & Deploy dist to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clean install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Run calculator tests
        run: npm run test

      - name: Resolve production SITE_URL
        shell: bash
        env:
          VAR_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$VAR_SITE_URL" ]; then
            echo "SITE_URL=$VAR_SITE_URL" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
          fi

      - name: Build project
        run: npm run build:production

      - name: Write custom domain CNAME if configured
        if: env.SITE_URL != ''
        shell: bash
        run: |
          HOST=$(node -e "console.log(new URL(process.env.SITE_URL).hostname)")
          if [[ "$HOST" != *.github.io && ! -f dist/CNAME ]]; then
            echo "$HOST" > dist/CNAME
          fi

      - name: Deploy dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
